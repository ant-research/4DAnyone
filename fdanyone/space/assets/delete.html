<button type="button" class="delete-output" disabled>Delete Output</button>
<dialog class="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
  <h3 id="delete-title">Delete Output?</h3>
  <p id="delete-description">Permanently delete this task's saved settings, recovered motion and generated videos. The source video is kept. This cannot be undone.</p>
  <code class="delete-path"></code>
  <div class="delete-actions">
    <button type="button" class="keep-output" autofocus>Keep Output</button>
    <button type="button" class="confirm-delete">Delete Output</button>
  </div>
</dialog>
